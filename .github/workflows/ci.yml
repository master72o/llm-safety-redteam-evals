name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov
      - name: Run Pytest Suite
        run: |
          pytest --cov=safety_evals tests/
      - name: Run Safety Red-Team Evaluation CLI
        run: |
          python -m safety_evals.cli run --dataset data/redteam_attacks.jsonl --output-dir results --report-path reports/safety_redteam_report.md --figures-dir reports/figures
